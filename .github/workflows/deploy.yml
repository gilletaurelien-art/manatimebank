name: Deploy live

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ═══════════════════════════════════════════════════════════════════
      #  🔴 REMPLACE LE DÉPLOIEMENT GitHub Pages, QUI NE SERVAIT RIEN.
      #
      #  Mesuré le 17/11/2026 : manatimebank.org résout sur le KS-5
      #  (147.135.254.25), servi par Caddy depuis /srv/www-manatimebank.
      #  L'ancien job déployait sur Pages à chaque push, RÉUSSISSAIT à
      #  chaque fois (vert dans l'historique des runs), et n'atteignait
      #  JAMAIS le domaine public. 35 commits (9 PR le 14/11 seul) se sont
      #  accumulés sur 18 jours sans qu'un seul n'arrive en ligne — un
      #  déploiement vert qui vise la mauvaise cible est indiscernable
      #  d'un vrai déploiement jusqu'à ce qu'on COMPARE le site public à
      #  ce que CI prétend avoir expédié.
      #
      #  ⭐ C'est pour ça que ce job n'appelle pas juste rsync : il appelle
      #  `scripts/deployer-ks5.sh`, qui se VÉRIFIE contre le domaine réel
      #  après coup (empreinte de chaque route) et ÉCHOUE si le public ne
      #  reçoit pas ce qui vient d'être construit. Un run vert ici veut
      #  dire que manatimebank.org sert CE commit — pas qu'une commande a
      #  rendu 0.
      # ═══════════════════════════════════════════════════════════════════
      - name: Déployer sur le KS-5 (le domaine réel)
        env:
          MANA_SSH_KEY: /tmp/mana_deploy_key
        run: |
          install -m 600 /dev/null "$MANA_SSH_KEY"
          printf '%s\n' "${{ secrets.MANA_KS5_DEPLOY_KEY }}" > "$MANA_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.MANA_KS5_HOST_KEY }}" >> ~/.ssh/known_hosts
          bash scripts/deployer-ks5.sh

      - name: Retirer la clé privée du disque du runner
        if: always()
        run: shred -u /tmp/mana_deploy_key 2>/dev/null || rm -f /tmp/mana_deploy_key
